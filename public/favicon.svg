<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4F46E5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#312E81" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Chat Bubble with speech tail -->
  <path d="M7 9C7 7.34315 8.34315 6 10 6H22C23.6569 6 25 7.34315 25 9V17C25 18.6569 23.6569 20 22 20H15L10 24V20H10C8.34315 20 7 18.6569 7 17V9Z" fill="url(#bubbleGrad)" filter="url(#glow)"/>

  <!-- Stylized "T" Logo Spark inside bubble -->
  <path d="M12 10.5H20M16 10.5V16.5" stroke="url(#sparkGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Real-time Emerald Pulse Dot -->
  <circle cx="23" cy="8" r="2" fill="#10B981"/>
  <circle cx="23" cy="8" r="3" stroke="#10B981" stroke-width="0.75" stroke-opacity="0.6"/>
</svg>
